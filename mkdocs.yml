site_name: 大模型学习记录
site_description: Personal notes, implementations, projects, paper reading, and engineering exploration around large language models.
site_url: https://zackliang.github.io/llm-learning-journey/
repo_url: https://github.com/ZackLiang/llm-learning-journey
repo_name: ZackLiang/llm-learning-journey
edit_uri: edit/main/docs/
theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - 学习笔记:
      - 学习路线: roadmap.md
      - 专题总览: notes/index.md
      - Transformer 专题:
          - 专题总览: notes/transformer/index.md
          - 01. 整体架构: notes/transformer/01-big-picture.md
          - 02. Attention 与位置编码: notes/transformer/02-attention-position.md
          - 03. Block、FFN 与训练: notes/transformer/03-block-training.md
          - 04. Decoder-only 与推理: notes/transformer/04-decoder-inference.md
          - 05. 现代 Transformer: notes/transformer/05-modern-variants.md
          - 学习反思: notes/transformer/reflection.md
      - 模型内部结构: notes/model-internals.md
      - 训练与对齐: notes/training.md
      - 评测: notes/evaluation.md
      - 推理与系统: notes/inference.md
      - RAG 与 Agent: notes/rag-agents.md
  - 前沿开源项目解读:
      - 专题总览: projects/index.md
  - 论文阅读:
      - 专题总览: paper-notes/index.md
      - Agent 自进化:
          - 专题总览: paper-notes/agent-self-evolution/index.md
          - 01. 记忆演化:
              - 总览: paper-notes/agent-self-evolution/memory/index.md
              - UMEM（详细解读）: paper-notes/agent-self-evolution/memory/umem.md
          - 02. Skill 与 SOP 演化:
              - 总览: paper-notes/agent-self-evolution/skill-sop/index.md
          - 03. Verifier 与 Rubric 演化:
              - 总览: paper-notes/agent-self-evolution/verifier-rubric/index.md
          - 04. 自生成任务与 Self-Play:
              - 总览: paper-notes/agent-self-evolution/self-play-curriculum/index.md
          - 05. Agentic RL 与系统:
              - 总览: paper-notes/agent-self-evolution/agentic-rl-systems/index.md
          - 06. 评测、安全与反过拟合:
              - 总览: paper-notes/agent-self-evolution/evaluation-safety/index.md
              - Rethinking Self-Evolving Agent Skills（详细解读）: paper-notes/rethinking-self-evolving-agent-skills.md
  - 个人项目:
      - 专题总览: personal-projects/index.md
      - 亲手实现: implementations/index.md
      - 工程记录: engineering/index.md
  - 碎碎念:
      - 总览: reflections/index.md
      - 为什么建立这个仓库: reflections/why-this-repo.md





extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/mathjax.js
  - javascripts/media-viewer.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js






