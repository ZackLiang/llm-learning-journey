              - AIDE²: paper-notes/agent-self-evolution/rsi/aide2.md
              - RRSI: paper-notes/agent-self-evolution/rsi/rrsi.md
              - AlphaEvolve: paper-notes/agent-self-evolution/rsi/alphaevolve.md
  - 个人项目:
      - 专题总览: personal-projects/index.md
      - 亲手实现: implementations/index.md
      - 工程记录: engineering/index.md
  - 碎碎念:
