site_name: 大模型学习记录
site_description: Personal notes, implementations, projects, paper reading, and engineering exploration around large language models.
site_url: https://zackliang.github.io/llm-learning-journey/
repo_url: https://github.com/ZackLiang/llm-learning-journey
repo_name: ZackLiang/llm-learning-journey
edit_uri: edit/main/docs/
theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - 学习笔记:
      - 学习路线: roadmap.md
      - 专题总览: notes/index.md
      - 01. 模型与架构:
          - Transformer 专题:
              - 专题总览: notes/transformer/index.md
              - 01. 整体架构: notes/transformer/01-big-picture.md
              - 02. Attention 与位置编码: notes/transformer/02-attention-position.md
              - 03. Block、FFN 与训练: notes/transformer/03-block-training.md
              - 04. Decoder-only 与推理: notes/transformer/04-decoder-inference.md
              - 05. 现代 Transformer: notes/transformer/05-modern-variants.md
              - 学习反思: notes/transformer/reflection.md
          - 模型内部结构: notes/model-internals.md
      - 02. Agent 工程:
          - 上下文管理: notes/context-management/index.md
          - RAG 与 Agent: notes/rag-agents.md
      - 03. 训练与评测:
          - 训练与对齐: notes/training.md
          - 评测: notes/evaluation.md
      - 04. 推理与系统:
          - 推理与系统: notes/inference.md
  - 前沿开源项目解读:
      - 专题总览: projects/index.md
      - Codex 源码解读: projects/codex-source.md
  - 论文阅读:
      - 专题总览: paper-notes/index.md
      - Agent 自进化:
          - 专题总览: paper-notes/agent-self-evolution/index.md
          - 01. 记忆演化:
              - 总览: paper-notes/agent-self-evolution/memory/index.md
              - UMEM: paper-notes/agent-self-evolution/memory/umem.md
              - MemRL: paper-notes/agent-self-evolution/memory/memrl.md
              - MemSkill: paper-notes/agent-self-evolution/memory/memskill.md
              - TMEM: paper-notes/agent-self-evolution/memory/tmem.md
              - EvoMemBench: paper-notes/agent-self-evolution/memory/evomembench.md
          - 02. Skill 与 SOP 演化:
              - 总览: paper-notes/agent-self-evolution/skill-sop/index.md
              - EvoSOP: paper-notes/agent-self-evolution/skill-sop/evosop.md
              - Socratic-SWE: paper-notes/agent-self-evolution/skill-sop/socratic-swe.md
              - MUSE-Autoskill: paper-notes/agent-self-evolution/skill-sop/muse-autoskill.md
              - CoEvoSkills: paper-notes/agent-self-evolution/skill-sop/coevoskills.md
              - SkillEvoReg: paper-notes/agent-self-evolution/skill-sop/skillevoreg.md
              - SkillScriptBench: paper-notes/agent-self-evolution/skill-sop/skillscriptbench.md
          - 03. Verifier 与 Rubric 演化:
              - 总览: paper-notes/agent-self-evolution/verifier-rubric/index.md
              - DeepVerifier: paper-notes/agent-self-evolution/verifier-rubric/deepverifier.md
              - RLCER: paper-notes/agent-self-evolution/verifier-rubric/rlcer.md
              - EVE-Agent: paper-notes/agent-self-evolution/verifier-rubric/eve-agent.md
              - SkillSandbox: paper-notes/agent-self-evolution/verifier-rubric/skillsandbox.md
          - 04. 自生成任务与 Self-Play:
              - 总览: paper-notes/agent-self-evolution/self-play-curriculum/index.md
              - R-Zero: paper-notes/agent-self-evolution/self-play-curriculum/r-zero.md
              - Native Evolution: paper-notes/agent-self-evolution/self-play-curriculum/native-evolution.md
              - SAGE: paper-notes/agent-self-evolution/self-play-curriculum/sage.md
